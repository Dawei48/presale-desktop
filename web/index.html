<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>放心预</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══ 侧栏 ══════════════════════════════════════════════════ -->
<aside class="rail">
  <div class="rail-top">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7L12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 21V11"/>
      </svg>
    </div>
    <div class="wordmark">放心预</div>
  </div>

  <div class="rail-label">工作台</div>
  <button class="nav on" data-page="todo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 6h18M3 12h12M3 18h7"/></svg>
    <span class="txt">待办</span><span class="n" id="nav-todo">–</span>
  </button>
  <button class="nav" data-page="orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
    <span class="txt">全部订单</span><span class="n" id="nav-orders">–</span>
  </button>
  <button class="nav" data-page="kilns">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    <span class="txt">窑口</span><span class="n" id="nav-prod">–</span>
  </button>
  <button class="nav" data-page="products">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
    <span class="txt">商品库</span>
  </button>

  <div class="rail-label">记录</div>
  <button class="nav" data-page="imports">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
    <span class="txt">导入记录</span>
  </button>
  <button class="nav" data-page="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="txt">设置</span>
  </button>

  <div class="rail-foot">
    <div class="who">
      <div class="av" id="user-initial">王</div>
      <div><b id="user-name">王掌柜</b><span id="user-role">管理员</span></div>
    </div>
  </div>
</aside>

<!-- ══ 主区 ══════════════════════════════════════════════════ -->
<main class="stage">
  <div class="head">
    <div style="min-width:0">
      <h1 id="page-title">待办</h1>
      <div class="sub" id="page-sub">正在读取…</div>
    </div>
    <div class="head-actions">
      <div class="themeswitch" id="theme-switch" role="group" aria-label="主题">
        <button data-set-theme="light" title="浅色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          浅色
        </button>
        <button data-set-theme="dark" class="on" title="深色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          深色
        </button>
        <button data-set-theme="system" title="跟随系统">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          系统
        </button>
      </div>
      <button class="btn btn-ghost" id="btn-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建
      </button>
      <button class="btn btn-ghost" id="btn-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        搜索
      </button>
      <button class="btn btn-primary" id="btn-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"/></svg>
        导入订单
      </button>
    </div>
  </div>

  <div class="tools" id="tools">
    <div class="filters" id="filters">
      <button class="on" data-filter="all">全部</button>
      <button data-filter="presale">预售</button>
      <button data-filter="normal">现货</button>
      <button data-filter="stored">预存</button>
      <button data-filter="ready">待发货</button>
    </div>
    <div class="right" id="tools-right"></div>
  </div>

  <div class="list" id="list" tabindex="0"></div>

  <div class="footbar">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>Enter</kbd> 处理</span>
    <span><kbd>Ctrl</kbd><kbd>K</kbd> 搜索</span>
    <span class="sp"></span>
    <span id="sync-state">已同步</span>
  </div>
</main>

<!-- ══ 抽屉 ═══════════════════════════════════════════════════ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <b id="drawer-title">订单详情</b>
    <div style="flex:1"></div>
    <button class="iconbtn" id="drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<!-- ══ 命令面板 ════════════════════════════════════════════════ -->
<div class="cmd" id="cmd">
  <input id="cmd-input" placeholder="搜索订单号、客户、商品…" autocomplete="off">
  <div class="cmd-list" id="cmd-list"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
